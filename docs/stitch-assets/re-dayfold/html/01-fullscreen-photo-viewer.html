<body class="flex flex-col h-screen w-full">

</button>
</header>
<!-- Main Photo Viewer Canvas -->
<main class="relative flex-1 flex items-center justify-center w-full group">

<div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-10 transition-opacity duration-700 group-hover:opacity-30">

</div>

</div>
<!-- The Content Image -->
<div class="w-full h-auto max-h-[85vh] flex items-center justify-center overflow-hidden">
<img alt="Beijing street scene in the rain" class="w-full h-auto object-contain transition-transform duration-500 hover:scale-[1.02]" src="https://lh3.googleusercontent.com/aida/AP1WRLthjukl6cQDnhlGpu8_NHqvjZ4Th5fv-XiqpSvueFZPDZaCyW9BqZ9lOcNJcHINR35q7BVgFyOzh-aTUttvPemoufy0vVRz-vMAQ7DA0Y1hb7qGJvoP7n4islXWgXEtdB5grseynmPd32uSrVLXhnT34UyMVecPnnyEIwronJfBwrwvSn-UWKPHb947YChcSYTCAvymn3yyJaNQwGHvReMHhAOZcpbpsm0MbLRqHR602ahKdmxmwKIyad8"/>
</div>
</main>
<!-- Bottom UI Cluster -->

<div class="px-5 py-1.5 rounded-full bg-white/10 blur-edge border border-white/5 pointer-events-auto">

<!-- Interaction Hint -->

<div class="w-1.5 h-1.5 rounded-full bg-white/20"></div>
<div class="w-1.5 h-1.5 rounded-full bg-drawerAccent"></div>

<div class="w-1.5 h-1.5 rounded-full bg-white/20"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/20"></div>
</div>

</footer>
<!-- Interactive Layer for Tap-to-Hide UI -->
<script>
        let uiVisible = true;
        const topBar = document.querySelector('header');
        const footer = document.querySelector('footer');
        const hints = document.querySelectorAll('.group-hover\\:opacity-30');

        document.body.addEventListener('click', (e) => {
            // Only toggle if not clicking a button
            if (e.target.closest('button')) return;
            
            uiVisible = !uiVisible;
            const opacity = uiVisible ? '1' : '0';
            const pointer = uiVisible ? 'auto' : 'none';
            
            topBar.style.opacity = opacity;
            topBar.style.pointerEvents = pointer;
            footer.style.opacity = opacity;
            footer.style.pointerEvents = pointer;
            
            topBar.style.transition = 'opacity 0.4s ease-in-out';
            footer.style.transition = 'opacity 0.4s ease-in-out';
        });
        
        // Simple swipe gesture hint (simulated)
        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            if (Math.abs(touchEndX - touchStartX) > 50) {
                // Flash navigation indicators on swipe
                const chevrons = document.querySelectorAll('.material-symbols-outlined.font-thin');
                chevrons.forEach(c => {
                    c.parentElement.style.opacity = '0.6';
                    setTimeout(() => c.parentElement.style.opacity = '', 400);
                });
            }
        });
    </script>
