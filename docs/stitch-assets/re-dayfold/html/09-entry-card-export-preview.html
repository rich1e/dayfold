<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Close logic mock
        document.querySelector('button .material-symbols-outlined').parentElement.addEventListener('click', () => {
            const sheet = document.querySelector('.relative.w-full.h-\\[92vh\\]');
            sheet.style.transform = 'translateY(100%)';
            sheet.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            setTimeout(() => {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.3s ease';
            }, 200);
        });
