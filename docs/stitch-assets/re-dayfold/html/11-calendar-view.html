<script>
        // Simple micro-interaction for the bottom sheet
        let sheet = document.getElementById('bottomSheet');
        let startY = 0;
        let currentY = 0;

        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, {passive: true});

        sheet.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            let diff = currentY - startY;
            if (diff > 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        }, {passive: true});

        sheet.addEventListener('touchend', (e) => {
            let diff = currentY - startY;
            if (diff > 100) {
                // Collapse logic would go here if we wanted to hide it
                sheet.style.transform = `translateY(90%)`;
            } else {
                sheet.style.transform = `translateY(0)`;
            }
        });

        // Tap day cell to "select" it
        const cells = document.querySelectorAll('.day-cell');
        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                // Clear previous selection (simple mock)
                document.querySelectorAll('.absolute.inset-0\\.5.bg-warmLight').forEach(el => el.remove());
                
                // Add select highlight if it's not a spacer
                if (cell.innerText.trim() !== "" && !cell.classList.contains('opacity-40')) {
                    const highlight = document.createElement('div');
                    highlight.className = 'absolute inset-0.5 bg-warmLight rounded-lg border border-warmGray/20';
                    cell.prepend(highlight);
                    
                    // Bounce sheet to show activity
                    sheet.style.transform = 'translateY(-10px)';
                    setTimeout(() => sheet.style.transform = 'translateY(0)', 200);
                }
            });
        });
    </script>
