<script>
        // Simple Interaction for the Bottom Sheet
        let startY;
        const sheet = document.getElementById('bottomSheet');
        const handle = sheet.querySelector('.w-12');

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        handle.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        });

        handle.addEventListener('touchend', (e) => {
            const currentY = e.changedTouches[0].clientY;
            const diff = currentY - startY;
            if (diff > 100) {
                // Peek state or dismissed
                sheet.style.transform = 'translateY(150px)';
            } else {
                sheet.style.transform = 'translateY(0)';
            }
        });

        // Atmospheric Micro-interaction: Subtle parallax on map markers
        window.addEventListener('mousemove', (e) => {
            const markers = document.querySelectorAll('.bg-warmAccent');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            markers.forEach((marker, index) => {
                const speed = (index + 1) * 2;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                marker.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
