<style>
        .paper-texture {
            background-color: #3C3C44;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.1) 100%);
            position: relative;
            overflow: hidden;
        }
        .paper-texture::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }
        .paperDrop {
            animation: paperDropAnim 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes paperDropAnim {
            0% { transform: perspective(1000px) rotateX(-8deg) translateY(-12pt); opacity: 0; }
            100% { transform: perspective(1000px) rotateX(0deg) translateY(0); opacity: 1; }
        }
        .emboss-book {
            text-shadow: -1px -1px 0px rgba(255,255,255,0.1), 1px 1px 0px rgba(0,0,0,0.5);
            color: #E8D5B8;
        }
        .glow-hint {
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-warmPaper text-on-surface antialiased select-none overflow-hidden">
<!-- Main Lock Screen Container -->
<main class="paper-texture h-screen w-full flex flex-col items-center justify-between py-16 px-8">
<!-- Top Spacer for iOS Status Bar -->
<div class="h-8"></div>
<!-- App Identity Area -->
<section class="flex flex-col items-center paperDrop" style="margin-top: 5vh;">
<!-- App Icon -->
<div class="w-[60pt] h-[60pt] bg-coverLeather rounded-[16pt] shadow-[0_8px_16px_rgba(0,0,0,0.4)] flex items-center justify-center relative overflow-hidden mb-6 group active:scale-95 transition-transform duration-200">
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
<span class="material-symbols-outlined text-[32pt] emboss-book" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<!-- Wordmark -->
<h1 class="font-headline-lg text-[24px] text-emberOrange tracking-[2px] mb-4">DAYFOLD</h1>
<!-- Divider -->
<div class="w-[60pt] h-[1pt] bg-tertiary opacity-80 mb-4"></div>
<!-- Tagline -->
<p class="font-label-md text-label-md text-warmBrown tracking-widest">私人日记</p>
</section>
<!-- Unlock Area -->
<section class="w-full max-w-[340pt] flex flex-col items-center gap-6 mt-auto mb-12">
<!-- Unlock Button -->
<button class="w-full h-14 bg-emberOrange active:scale-95 transition-all duration-200 rounded-xl flex items-center justify-center gap-3 shadow-[0_4px_12pt_rgba(224,90,58,0.35)] group" onclick="handleUnlock()">
<span class="material-symbols-outlined text-white text-[20pt]">drafts</span>
<span class="font-body-lg text-white font-medium">解锁 Dayfold</span>
</button>
<!-- Hint Text -->
<div class="flex flex-col items-center gap-1 glow-hint">
<p class="font-label-sm text-label-sm text-warmGray">使用 Face ID 或 Touch ID 解锁</p>
</div>
</section>
<!-- Footer -->
<footer class="pb-safe">
<p class="font-label-sm text-label-sm text-warmBrown opacity-60">Dayfold · 私人日记</p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        function handleUnlock() {
            const btn = document.querySelector('button');
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback for click
            btn.classList.add('scale-95');
            
            // Simulate FaceID success
            setTimeout(() => {
                icon.innerText = 'check_circle';
                btn.style.backgroundColor = '#239eb7'; // cyan success
                btn.querySelector('span:last-child').innerText = '已验证';
                
                // Add a little haptic-like shake or success feel
                document.body.classList.add('transition-all', 'duration-500', 'opacity-0', 'scale-110');
                
                setTimeout(() => {
                    // In a real app, this would navigate
                    alert('欢迎回到 Dayfold');
                    location.reload();
                }, 600);
            }, 800);
        }

        // Prevent accidental scrolling on iOS
        document.addEventListener('touchmove', function (e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body></html>
